<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1d3a"/>
      <stop offset="50%" stop-color="#0f2a54"/>
      <stop offset="100%" stop-color="#0a1d3a"/>
    </linearGradient>

    <!-- M silver/chrome gradient -->
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f7fa"/>
      <stop offset="35%" stop-color="#c8ced6"/>
      <stop offset="55%" stop-color="#8b95a4"/>
      <stop offset="80%" stop-color="#c8ced6"/>
      <stop offset="100%" stop-color="#5a6473"/>
    </linearGradient>

    <!-- S blue gradient -->
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e90ff"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Highlight on M -->
    <linearGradient id="mHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Crescent (crescent shape, light blue) -->
    <linearGradient id="crescentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5dbbff"/>
      <stop offset="50%" stop-color="#3da5f5"/>
      <stop offset="100%" stop-color="#1d7fd0"/>
    </linearGradient>

    <!-- Drop shadow for letters -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.45"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Crescent (light blue arc around the right side, opening to the left) -->
  <g opacity="0.95">
    <!-- Outer crescent: full circle minus inner offset circle -->
    <path d="M 620 100
             A 180 180 0 1 1 620 400
             A 145 145 0 1 0 620 100 Z"
          fill="url(#crescentGrad)"/>
    <!-- subtle inner glow line -->
    <path d="M 620 100
             A 180 180 0 1 1 620 400"
          fill="none" stroke="#7fcfff" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- M letter (silver chrome) -->
  <g filter="url(#shadow)">
    <path d="M 110 380
             L 110 130
             L 175 130
             L 240 290
             L 305 130
             L 370 130
             L 370 380
             L 315 380
             L 315 220
             L 265 350
             L 215 350
             L 165 220
             L 165 380 Z"
          fill="url(#mGrad)"/>
    <!-- shine on M left stroke -->
    <path d="M 110 130 L 175 130 L 240 290 L 165 220 L 165 130 Z" fill="url(#mHighlight)" opacity="0.7"/>
  </g>

  <!-- S letter (blue) -->
  <g filter="url(#shadow)">
    <path d="M 410 200
             Q 410 130 510 130
             Q 600 130 600 195
             L 540 195
             Q 540 180 510 180
             Q 480 180 480 200
             Q 480 220 510 230
             L 555 245
             Q 610 260 610 320
             Q 610 380 510 380
             Q 410 380 410 315
             L 470 315
             Q 470 330 510 330
             Q 540 330 540 315
             Q 540 295 510 285
             L 465 270
             Q 410 255 410 200 Z"
          fill="url(#sGrad)"/>
    <!-- highlight on top of S -->
    <path d="M 410 200 Q 410 130 510 130 Q 600 130 600 195 L 540 195 Q 540 180 510 180 Q 480 180 480 200 Q 480 210 490 215 L 410 200 Z" fill="#7fcfff" opacity="0.35"/>
  </g>

  <!-- subtle reflection beneath -->
  <ellipse cx="240" cy="430" rx="180" ry="10" fill="#000000" opacity="0.25"/>
</svg>
